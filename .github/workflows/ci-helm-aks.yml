name: CI/CD — Build & Deploy (Helm to AKS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: saanvikit
  ACR_LOGIN_SERVER: saanvikit.azurecr.io
  IMAGE_NAME: aks-app
  HELM_RELEASE_NAME: aks-demo
  HELM_NAMESPACE: k8s-guide
  AKS_CLUSTER: saanvikit-aks
  AKS_RESOURCE_GROUP: aks-group

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Azure Login (service principal or OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER }} --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v1

      - name: Ensure namespace exists
        run: |
          kubectl get namespace ${{ env.HELM_NAMESPACE }} || kubectl create namespace ${{ env.HELM_NAMESPACE }}

      - name: Show chart files for debug
        run: |
          echo "Current workspace: $GITHUB_WORKSPACE"
          ls -la
          ls -la AKS/helm || true

      - name: Update chart dependencies (if any)
        run: |
          helm dependency update ./helm/aks-app || true

      - name: Deploy Helm chart (local path)
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./helm/aks-app \
            --namespace ${{ env.HELM_NAMESPACE }} \
            --set image.repository=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }}

      - name: Wait for rollout
        run: |
          DEPLOYMENT_NAME="aks-app-${{ env.HELM_RELEASE_NAME }}"
          kubectl -n ${{ env.HELM_NAMESPACE }} rollout status deployment/$DEPLOYMENT_NAME --timeout=120s || true
